name: Publish Docker Image

on:
  release:
    types: [published]
  # Publish straight from a version tag: git tag v0.3.0 && git push origin v0.3.0
  push:
    tags:
      - "v*.*.*"
  # Publish without a release or tag: Actions → Publish Docker Image → Run workflow
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for the image (e.g. 0.3.0). 'latest' is always pushed too."
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires a lowercase namespace, and the image must belong to whoever
      # owns this repository — hardcoding an org here breaks every fork.
      - name: Compute image tags
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${{ github.event.inputs.tag || github.ref_name }}"
          image="ghcr.io/${owner}/wyoming-openai-gateway"
          if [ "$version" = "latest" ]; then
            echo "tags=${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:latest,${image}:${version}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
